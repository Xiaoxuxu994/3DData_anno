# GLR track v0: 3DData_anno front end (filter) + GLRMap annotator + 3DData_anno back end (cross-witness QC).
# Every threshold below is a PRE-REGISTERED STARTING POINT, not a calibrated value (see docs/GLR_INTEGRATION.md, "What is validated").
# glr_common.DEFAULTS holds the same numbers; this file overrides them (tests/glr/test_common.py checks that they agree).
version: glr-v0
date: 2026-10-29
status: plumbing tested on synthetic data and on a pycolmap replica of GLRMap stage 1; NOT yet run against a real GLRMap checkout
sampling:            # frames handed to GLRMap: every stride-th frame of the 15 fps clip
  target_frames: 100       # GLRMap demo scale (100 frames, 10 fps x 10 s)
  min_frames: 60
  max_frames: 120
  max_stride: 4
  target_step_frac: 0.02   # motion between consecutive GLRMap frames, fraction of the image width (SfM-friendly baseline)
  default_stride: 2        # used when the flow stage has no statistics (e.g. --skip-filter)
route:               # clips that pass the filter: static scene + real parallax -> GLRMap; the rest stays with v1.3
  max_dyn_frac: 0.30       # flow.dyn_frac (filter stage s4)
  max_rot_frac: 0.60       # flow.rot_frac; the filter's soft flag no_parallax uses the same 0.6
  min_parallax_px: 0.5     # flow.parallax_px (512 px wide flow)
  max_static_pair_frac: 0.20
  min_mag_median_frac: 0.002
  force: null              # glr | v13 | null
stage1_gate:         # glr_stage1_gate.py; stop = do not spend RoMa/PDA on this camera, suspect = demote to T2
  min_reg_frac: 0.5
  min_pts_per_img: 50
  hfov_range_deg: [14.3, 118.1]    # focal 0.3 .. 4 x max(W, H), as in GLRMap's camera_sanity patch
  max_fx_fy_dev: 0.1
  max_planar_frac: 0.5             # PLANAR_OR_PANORAMIC share of the verified pairs (drone 100 %, indoor 100 %, KITTI <= 17 %)
  max_reproj_px: 1.0
  max_step_ratio: 5.0              # adjacent-camera step, max / median (Ahlbeck 15, KITTI 1.2-1.3)
  default_focal_w: 1.2             # COLMAP's default initial focal / width: a final focal this close was probably never estimated
  default_focal_tol: 0.06          # 0.03 in the evaluation sessions (Tokyo 1.18, Ahlbeck 1.19); the pycolmap replica ended at 1.16 on Ahlbeck
  min_median_tri_angle_deg: 2.0
  max_witness_hfov_dis_deg: 13.2   # same number as the v1c K-disagreement threshold
qc:
  thr: {xtraj_ba: 3.27, xdepth_k: 0.194, kdis: 13.2}   # v1c (E8), reused unchanged: the witnesses are noisier than GLRMap's good case
  tier1_part: 0.5          # T1 needs every v1c part <= 0.5 x its threshold
  reject_flags: [jump60, fov_out]
  label_long: 512
  qc_long: 512
  n_depth_frames: 8
  n_scale_frames: 10
reference_metrics: {}      # none yet: fill from the Phase-1 benchmark (A/B groups with GT, KITTI windows) before this config is adopted
